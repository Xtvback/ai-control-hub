name: Static Site Preview Artifact

on:
  workflow_dispatch:
  push:
    paths:
      - 'site/**'
      - 'scripts/check_site.py'
      - 'tests/test_site.py'
      - '.github/workflows/site-preview.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/check_site.py'
      - 'tests/test_site.py'
      - '.github/workflows/site-preview.yml'

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate site
        run: python scripts/check_site.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Package preview
        uses: actions/upload-artifact@v4
        with:
          name: static-site-preview
          path: site/
          retention-days: 3
